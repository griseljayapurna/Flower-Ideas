<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Photo credits</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .credits-main { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
    .credit { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .credit img { width: 64px; height: 64px; object-fit: contain; flex: 0 0 auto; background: var(--surface); border-radius: 10px; }
    .credit div { font-size: 0.9rem; line-height: 1.35; overflow-wrap: anywhere; }
    .credit strong { font-size: 1rem; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="btn btn-ghost" href="./">← Back</a>
    <h1 class="screen-title">Photo credits</h1>
    <span class="topbar-spacer"></span>
  </header>
  <main class="credits-main">
    <p>The built-in flower pictures come from <a href="https://commons.wikimedia.org/">Wikimedia Commons</a>.
      Thank you to the photographers who share their work. Pictures marked “background removed” were cut out
      for this app; the changed versions are shared under the same licence as the original.</p>
    <div id="list"></div>
  </main>
  <script>
    const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    fetch('flowers/library.json').then(r => r.json()).then(list => {
      document.getElementById('list').innerHTML = list.map(f => `
        <div class="credit">
          <img src="${esc(f.file)}" alt="" loading="lazy">
          <div>
            <strong>${esc(f.name)}</strong><br>
            <a href="${esc(f.source)}">${esc(f.title)}</a><br>
            by ${esc(f.author || 'unknown')} ·
            ${f.licenseUrl ? `<a href="${esc(f.licenseUrl)}">${esc(f.license)}</a>` : esc(f.license)}
            ${f.edited ? ' · background removed' : ''}
          </div>
        </div>`).join('');
    }).catch(() => {
      document.getElementById('list').textContent = 'The list could not be loaded.';
    });
  </script>
</body>
</html>
