<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Photo credits</title>
  <meta name="theme-color" content="#eef0fa">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <style>
    .credit-list { display: flex; flex-direction: column; gap: 10px; }
    .credit {
      display: flex; gap: 14px; align-items: center;
      padding: 12px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow);
    }
    .credit img { width: 64px; height: 64px; object-fit: contain; flex: 0 0 auto; background: var(--tint-2); border-radius: var(--radius-sm); }
    .credit div { font-size: 0.85rem; line-height: 1.4; color: var(--muted); overflow-wrap: anywhere; }
    .credit strong { display: block; font-size: 1rem; font-weight: 500; color: var(--text); }
    .intro { color: var(--muted); font-size: 0.92rem; margin: 0 0 18px; }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-head">
      <a class="icon-btn" href="./" aria-label="Back">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="page-head-text">
        <h1 class="page-title small">Photo credits</h1>
      </div>
    </header>
    <p class="intro">The built-in flower pictures come from <a href="https://commons.wikimedia.org/">Wikimedia Commons</a>.
      Thank you to the photographers who share their work. Pictures marked “background removed” were cut out
      for this app; the changed versions are shared under the same licence as the original.</p>
    <div id="list" class="credit-list"></div>
  </main>
  <script>
    const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    fetch('flowers/library.json').then(r => r.json()).then(list => {
      document.getElementById('list').innerHTML = list.map(f => `
        <div class="credit">
          <img src="${esc(f.file)}" alt="" loading="lazy">
          <div>
            <strong>${esc(f.name)}</strong>
            <a href="${esc(f.source)}">${esc(f.title)}</a><br>
            by ${esc(f.author || 'unknown')} ·
            ${f.licenseUrl ? `<a href="${esc(f.licenseUrl)}">${esc(f.license)}</a>` : esc(f.license)}
            ${f.edited ? ' · background removed' : ''}
          </div>
        </div>`).join('');
    }).catch(() => {
      document.getElementById('list').textContent = 'The list could not be loaded.';
    });
  </script>
</body>
</html>
