<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bloom Board</title>
  <meta name="description" content="Try out flower arrangements on your phone before you make them.">
  <meta name="theme-color" content="#eef0fa">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bloom Board">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ ICONS (thin line icons, used with <svg><use href="#i-name"/></svg>) ============ -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.3c-.7.3-1.2.9-1.2 1.7v.4"/><path d="M12 17.2v.1"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-rotate-left" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3"/><path d="M3.5 4v5h5"/></symbol>
      <symbol id="i-rotate-right" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.8-6.3"/><path d="M20.5 4v5h-5"/></symbol>
      <symbol id="i-flip" viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2.5"/><path d="M8.5 7L3.5 17h5z"/><path d="M15.5 7l5 10h-5z"/></symbol>
      <symbol id="i-front" viewBox="0 0 24 24"><path d="M5 4h14"/><path d="M12 20V9"/><path d="M7.5 13.5L12 9l4.5 4.5"/></symbol>
      <symbol id="i-back-layer" viewBox="0 0 24 24"><path d="M5 20h14"/><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M10 11v6M14 11v6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15.5l-5-5L6.5 20"/></symbol>
      <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.2-1-1.6-1-2.6 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11.5" r="1.1"/><circle cx="10" cy="7.5" r="1.1"/><circle cx="15" cy="7.5" r="1.1"/></symbol>
      <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="13" height="16.5" rx="2.5"/><rect x="9" y="2.5" width="6" height="4" rx="1.2"/><path d="M9 11.5h6M9 15.5h4"/></symbol>
      <symbol id="i-flower" viewBox="0 0 24 24"><path d="M12 12v9"/><path d="M12 21c-3.2-.6-5.5-2.6-6-5.8 3.2.2 5.6 2 6 5.8z"/><path d="M7 3.5c-.3 4.6 1.6 8 5 8s5.3-3.4 5-8l-2.6 2.2L12 2.8 9.6 5.7z"/></symbol>
      <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C5 10.5 10 5.2 20 4c-.8 10-6 15-15 15z"/><path d="M5 19l8.5-8.5"/></symbol>
      <symbol id="i-vase" viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v3.2C7.1 7.6 5 10.4 5 14a7 7 0 0 0 14 0c0-3.6-2.1-6.4-5-7.8V3"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V4.5a1.5 1.5 0 0 1 3 0v6"/><path d="M14 10.5V6a1.5 1.5 0 0 1 3 0v6.5"/><path d="M17 9.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1.2a6 6 0 0 1-4.6-2.2L4 15a1.6 1.6 0 0 1 2.4-2.1L8 14.5"/></symbol>
    </defs>
  </svg>

  <!-- ============ HOME ============ -->
  <section id="screen-home" class="screen active" aria-labelledby="home-title">
    <main class="page">
      <header class="page-head">
        <div>
          <p class="eyebrow">Your arrangement ideas</p>
          <h1 id="home-title" class="page-title">Bloom Board</h1>
        </div>
        <button class="icon-btn" data-action="help" type="button" aria-label="Help">
          <svg class="i" aria-hidden="true"><use href="#i-help"/></svg>
        </button>
      </header>

      <button id="btn-new" class="hero-card" type="button">
        <span class="hero-text">
          <strong>New arrangement</strong>
          <span>Try out an idea on a photo of the spot</span>
        </span>
        <span class="hero-plus" aria-hidden="true"><svg class="i"><use href="#i-plus"/></svg></span>
      </button>

      <div class="section-head">
        <h2 class="section-title" id="saved-title">My arrangements</h2>
        <span class="section-count" id="design-count"></span>
      </div>
      <div id="empty-home" class="empty-card" hidden>
        <span class="option-icon" aria-hidden="true"><svg class="i"><use href="#i-flower"/></svg></span>
        <p>Nothing saved yet.<br>Tap <strong>New arrangement</strong> to start.</p>
      </div>
      <ul id="design-grid" class="design-grid" aria-labelledby="saved-title"></ul>
      <p class="footer-note"><a href="credits.html">Photo credits</a></p>
    </main>
  </section>

  <!-- ============ NEW ARRANGEMENT ============ -->
  <section id="screen-new" class="screen" aria-labelledby="new-title">
    <main class="page">
      <header class="page-head">
        <button class="icon-btn" data-action="go-home" type="button" aria-label="Back">
          <svg class="i" aria-hidden="true"><use href="#i-back"/></svg>
        </button>
        <div class="page-head-text">
          <h1 id="new-title" class="page-title small">New arrangement</h1>
          <p class="muted">First, choose a background</p>
        </div>
      </header>

      <div class="option-list">
        <label class="option-card file-btn">
          <span class="option-icon" aria-hidden="true"><svg class="i"><use href="#i-camera"/></svg></span>
          <span class="option-text"><strong>Take a photo</strong><span>Photograph the place for your flowers</span></span>
          <svg class="i chevron" aria-hidden="true"><use href="#i-next"/></svg>
          <input id="input-camera" type="file" accept="image/*" capture="environment">
        </label>
        <label class="option-card file-btn">
          <span class="option-icon" aria-hidden="true"><svg class="i"><use href="#i-image"/></svg></span>
          <span class="option-text"><strong>Choose from my photos</strong><span>Use a picture you already took</span></span>
          <svg class="i chevron" aria-hidden="true"><use href="#i-next"/></svg>
          <input id="input-bg-photo" type="file" accept="image/*">
        </label>
        <div class="option-card colour-card">
          <div class="option-row">
            <span class="option-icon" aria-hidden="true"><svg class="i"><use href="#i-palette"/></svg></span>
            <span class="option-text"><strong>Plain colour</strong><span>No photo yet? Start on a colour</span></span>
          </div>
          <div id="color-choices" class="color-choices"></div>
        </div>
      </div>
    </main>
  </section>

  <!-- ============ EDITOR ============ -->
  <section id="screen-editor" class="screen editor" aria-label="Design your arrangement">
    <header class="editor-top">
      <button class="bar-btn" id="btn-editor-back" type="button">
        <span class="bar-icon"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></span><small>Done</small>
      </button>
      <div class="bar-group">
        <button class="bar-btn" id="btn-undo" type="button">
          <span class="bar-icon"><svg class="i" aria-hidden="true"><use href="#i-undo"/></svg></span><small>Undo</small>
        </button>
        <button class="bar-btn" id="btn-redo" type="button">
          <span class="bar-icon"><svg class="i" aria-hidden="true"><use href="#i-redo"/></svg></span><small>Redo</small>
        </button>
        <button class="bar-btn" data-action="help" type="button">
          <span class="bar-icon"><svg class="i" aria-hidden="true"><use href="#i-help"/></svg></span><small>Help</small>
        </button>
      </div>
      <button class="pill-btn primary" id="btn-export" type="button">
        <svg class="i" aria-hidden="true"><use href="#i-download"/></svg><span>Save picture</span>
      </button>
    </header>

    <div id="stage" class="stage">
      <canvas id="canvas" aria-label="Your arrangement"></canvas>
      <p id="stage-hint" class="stage-hint">Tap a flower below to add it</p>

      <!-- Zoom: see details up close -->
      <div class="zoom-ctrl" role="group" aria-label="Zoom">
        <button id="btn-zoom-in" type="button" aria-label="Zoom in"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <span id="zoom-label" class="zoom-pct" aria-live="polite">100%</span>
        <button id="btn-zoom-out" type="button" aria-label="Zoom out"><svg class="i" aria-hidden="true"><use href="#i-minus"/></svg></button>
        <button id="btn-zoom-fit" type="button" aria-label="Show the whole picture"><svg class="i" aria-hidden="true"><use href="#i-fit"/></svg></button>
      </div>

      <!-- Shown when a flower is selected -->
      <div id="selection-bar" class="selection-bar" hidden>
        <button class="tool" data-tool="bigger" type="button"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>Bigger</button>
        <button class="tool" data-tool="smaller" type="button"><svg class="i" aria-hidden="true"><use href="#i-minus"/></svg>Smaller</button>
        <button class="tool" data-tool="rotate-left" type="button"><svg class="i" aria-hidden="true"><use href="#i-rotate-left"/></svg>Turn</button>
        <button class="tool" data-tool="rotate-right" type="button"><svg class="i" aria-hidden="true"><use href="#i-rotate-right"/></svg>Turn</button>
        <button class="tool" data-tool="flip" type="button"><svg class="i" aria-hidden="true"><use href="#i-flip"/></svg>Flip</button>
        <button class="tool" data-tool="front" type="button"><svg class="i" aria-hidden="true"><use href="#i-front"/></svg>Front</button>
        <button class="tool" data-tool="back" type="button"><svg class="i" aria-hidden="true"><use href="#i-back-layer"/></svg>Back</button>
        <button class="tool" data-tool="copy" type="button"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg>Copy</button>
        <button class="tool tool-danger" data-tool="delete" type="button"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>Remove</button>
        <button class="tool tool-done" data-tool="deselect" type="button"><span class="done-dot"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg></span>OK</button>
      </div>
    </div>

    <!-- Flower tray -->
    <div class="tray" id="tray">
      <div class="tray-tabs" role="tablist">
        <button class="tab active" role="tab" data-cat="flowers" type="button" aria-selected="true"><svg class="i" aria-hidden="true"><use href="#i-flower"/></svg>Flowers</button>
        <button class="tab" role="tab" data-cat="greenery" type="button" aria-selected="false"><svg class="i" aria-hidden="true"><use href="#i-leaf"/></svg>Greenery</button>
        <button class="tab" role="tab" data-cat="vases" type="button" aria-selected="false"><svg class="i" aria-hidden="true"><use href="#i-vase"/></svg>Vases</button>
        <button class="tab" role="tab" data-cat="mine" type="button" aria-selected="false"><svg class="i" aria-hidden="true"><use href="#i-star"/></svg>My flowers</button>
      </div>
      <div class="tray-items" id="tray-items" role="tabpanel"></div>
    </div>
  </section>

  <!-- ============ HELP ============ -->
  <div id="help" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="help-heading">
    <div class="help-card">
      <button class="close-btn" id="help-close" type="button" aria-label="Close help">
        <svg class="i" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
      <div id="help-pages"></div>
      <div class="help-dots" id="help-dots" aria-hidden="true"></div>
      <div class="dialog-buttons">
        <button class="pill-btn ghost" id="help-prev" type="button">Back</button>
        <button class="pill-btn primary" id="help-next" type="button">Next</button>
      </div>
    </div>
  </div>

  <!-- ============ DIALOG ============ -->
  <div id="dialog" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="dialog">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <div id="dialog-buttons" class="dialog-buttons"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="busy" class="overlay busy" hidden><div class="spinner" aria-label="Please wait"></div></div>

  <!-- hidden file input for "Add from photos" in the tray -->
  <input id="input-my-flower" type="file" accept="image/*" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
